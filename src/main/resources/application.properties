# =============================================================================
# Application DRH - Kisalu (Spring Boot)
# Portage de l'API PHP : c:\xampp\htdocs\app_api\app
# Prefixe des routes : /api/v1/{module}/...
# =============================================================================

spring.application.name=drh

# -----------------------------------------------------------------------------
# Springdoc OpenAPI / Swagger UI
# -----------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

# -----------------------------------------------------------------------------
# Connexion base de donnees (MariaDB/MySQL via XAMPP)
# Base : kisalu_sandBox (dump kisalu_sandBox.sql)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/kisalu_sandBox?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=none : ne pas modifier le schema existant (tables deja creees en SQL)
# physical_naming_strategy : conserve les noms de colonnes exacts (Id, libele...)
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -----------------------------------------------------------------------------
# Upload fichiers (ex: photo agent dans registerAgent - max 1 Mo comme en PHP)
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=22MB
app.upload.photos-agents-dir=uploads/photos_agents
app.upload.public-photos-path=photos_agents

# -----------------------------------------------------------------------------
# JWT - identique au .env PHP (TokenControllers / ViewInterface)
# Header requis : Authorizations: tac <token>
# access-sub=AUTH  -> token d'acces API
# refresh-sub=REFRESH -> token de renouvellement uniquement
# -----------------------------------------------------------------------------
app.environment=DEV
app.jwt.secret=uurifuhquhdfyzbhjbrfhbre874HNIU4NUHNDIU4HHUh_U7H487H4HjHIU487h4UH48H8YRJJUI38U733987Y3EHUIHDIUH
app.jwt.duration=3600
app.jwt.algorithm=HS256
app.jwt.access-sub=AUTH
app.jwt.refresh-sub=REFRESH
